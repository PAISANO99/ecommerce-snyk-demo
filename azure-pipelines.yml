# Azure DevOps Pipeline definition for E-Commerce Web Application
# This pipeline automates CI/CD, Performance Testing, Code Coverage, and Quality Metrics.

trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: SnykSecurityScan
    displayName: 'Snyk Security Suite (SCA, Code, Container & IaC)'
    jobs:
      - job: SnykScanJob
        displayName: 'Snyk Full Security Scan'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js 20.x'

          - script: |
              npm install -g snyk
            displayName: 'Install Snyk CLI'

          - script: |
              snyk test --all-projects
            displayName: 'Snyk Open Source (Dependencies) Scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true

          - script: |
              snyk test --all-projects --licenses
            displayName: 'Snyk Licenses Scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true

          - script: |
              snyk code test
            displayName: 'Snyk Code (SAST) Scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true

          - script: |
              snyk container test node:20-alpine --file=server/Dockerfile
              snyk container test nginx:1.25-alpine --file=client/Dockerfile
            displayName: 'Snyk Container Scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true

          - script: |
              snyk iac test k8s/ docker-compose.yml
            displayName: 'Snyk Infrastructure as Code (IaC) Scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true

  - stage: BuildAndTest
    displayName: 'Build, Quality & Performance Stage'
    jobs:
      - job: ServerQuality
        displayName: 'Server Quality & Performance Metrics'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js 20.x'

          - script: |
              npm ci
            workingDirectory: 'server'
            displayName: 'Install Server Dependencies'

          - script: |
              npx prisma generate
            workingDirectory: 'server'
            displayName: 'Generate Prisma Client'

          - script: |
              npm run lint
            workingDirectory: 'server'
            displayName: 'Run Server Linter'

          - script: |
              npx vitest run --reporter=junit --outputFile=server-test-results.xml --coverage --coverage.reporter=cobertura --coverage.reporter=text
            workingDirectory: 'server'
            displayName: 'Run Server Unit/Integration Tests & Coverage'
            continueOnError: false

          - script: |
              npm run test:load
            workingDirectory: 'server'
            displayName: 'Run Server Load & Performance Benchmark (Autocannon)'

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'server/server-test-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Server Integration, Unit & Performance Tests'
            displayName: 'Publish Server Test Metrics'

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: 'server/coverage/cobertura-coverage.xml'
            displayName: 'Publish Server Code Coverage'

          - script: |
              npm run build
            workingDirectory: 'server'
            displayName: 'Build Server Application'

      - job: ClientQuality
        displayName: 'Client Quality & Coverage Metrics'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js 20.x'

          - script: |
              npm ci
            workingDirectory: 'client'
            displayName: 'Install Client Dependencies'

          - script: |
              npm run lint
            workingDirectory: 'client'
            displayName: 'Run Client Linter'

          - script: |
              npm run typecheck
            workingDirectory: 'client'
            displayName: 'Run TypeScript Type Check'

          - script: |
              npx vitest run --reporter=junit --outputFile=client-test-results.xml --coverage --coverage.reporter=cobertura --coverage.reporter=text
            workingDirectory: 'client'
            displayName: 'Run Client Tests & Coverage'
            continueOnError: false

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'client/client-test-results.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Client Unit & Component Tests'
            displayName: 'Publish Client Test Metrics'

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: 'client/coverage/cobertura-coverage.xml'
            displayName: 'Publish Client Code Coverage'

          - script: |
              npm run build
            workingDirectory: 'client'
            displayName: 'Build Client Bundle'
